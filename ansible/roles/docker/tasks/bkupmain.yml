---
# ---------------------------------------------------------
# 1. Copy webapp folder FIRST
# ---------------------------------------------------------

- name: Copy webapp folder to EC2
  copy:
    src: webapp/
    dest: /home/ec2-user/webapp/
    mode: '0755'

# ---------------------------------------------------------
# 2. Check if previous checksum exists
# ---------------------------------------------------------

- name: Check if previous checksum exists
  stat:
    path: /home/ec2-user/webapp.checksum
  register: prev_checksum_file

# ---------------------------------------------------------
# 3. If previous checksum exists, rename it
# ---------------------------------------------------------

- name: Rename previous checksum to old_webapp.checksum
  command: mv /home/ec2-user/webapp.checksum /home/ec2-user/old_webapp.checksum
  when: prev_checksum_file.stat.exists

# ---------------------------------------------------------
# 4. Generate NEW checksum
# ---------------------------------------------------------

- name: Generate NEW checksum of Dockerfile + app.py
  command: bash -c "cat /home/ec2-user/webapp/Dockerfile /home/ec2-user/webapp/app.py | sha256sum"
  register: new_checksum

- name: Save NEW checksum to webapp.checksum
  copy:
    content: "{{ new_checksum.stdout.split()[0] }}"
    dest: /home/ec2-user/webapp.checksum

# ---------------------------------------------------------
# 5. Load OLD checksum (only if it existed)
# ---------------------------------------------------------

- name: Load OLD checksum
  command: cat /home/ec2-user/old_webapp.checksum
  register: old_checksum
  when: prev_checksum_file.stat.exists

# ---------------------------------------------------------
# 6. Compare NEW checksum vs OLD checksum
# ---------------------------------------------------------

- name: Determine if code changed
  set_fact:
    code_changed: "{{ (not prev_checksum_file.stat.exists) or (new_checksum.stdout.split()[0] != old_checksum.stdout.split()[0]) }}"

# ---------------------------------------------------------
# 7. If no change → skip deployment
# ---------------------------------------------------------

- name: Print no-change message
  debug:
    msg: "No change in application code. Deployment skipped."
  when: not code_changed

# ---------------------------------------------------------
# 8. Install Docker (idempotent)
# ---------------------------------------------------------

- name: Check if Docker is installed
  command: docker --version
  register: docker_check
  ignore_errors: yes

- name: Install Docker if missing
  yum:
    name: docker
    state: present
  when: docker_check.failed

- name: Start Docker
  service:
    name: docker
    state: started
    enabled: yes

# ---------------------------------------------------------
# 9. Build Docker image only when code changed
# ---------------------------------------------------------

- name: Build Docker image only when code changed
  community.docker.docker_image:
    name: mywebapp
    build:
      path: /home/ec2-user/webapp
  when: code_changed

# ---------------------------------------------------------
# 10. Stop old container BEFORE creating new one
# ---------------------------------------------------------

- name: Check if old container exists
  community.docker.docker_container_info:
    name: webapp
  register: container_info
  when: code_changed

- name: Stop old container if running
  community.docker.docker_container:
    name: webapp
    state: stopped
  when: code_changed and container_info.exists

# ---------------------------------------------------------
# 11. Deploy new container only when image changed
# ---------------------------------------------------------

- name: Deploy new container only when code changed
  community.docker.docker_container:
    name: webapp
    image: mywebapp:latest
    state: started
    recreate: true
    restart_policy: always
    published_ports:
      - "80:80"
  when: code_changed
