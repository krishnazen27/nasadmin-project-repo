---
# ---------------------------------------------------------
# 1. Detect code changes using checksum
# ---------------------------------------------------------

- name: Calculate checksum of webapp folder
  command: sha256sum /home/ec2-user/webapp/Dockerfile /home/ec2-user/webapp/app.py
  register: new_checksum
  ignore_errors: yes

- name: Check if previous checksum exists
  stat:
    path: /home/ec2-user/webapp.checksum
  register: checksum_file

- name: Load previous checksum
  command: cat /home/ec2-user/webapp.checksum
  register: old_checksum
  when: checksum_file.stat.exists
  ignore_errors: yes

- name: Determine if code changed
  set_fact:
    code_changed: "{{ (not checksum_file.stat.exists) or (new_checksum.stdout != old_checksum.stdout) }}"

- name: Print no-change message
  debug:
    msg: "No change in application code. Deployment skipped."
  when: not code_changed

- name: Save new checksum
  copy:
    content: "{{ new_checksum.stdout }}"
    dest: /home/ec2-user/webapp.checksum
  when: code_changed

# ---------------------------------------------------------
# 2. Install Docker (idempotent)
# ---------------------------------------------------------

- name: Check if Docker is installed
  command: docker --version
  register: docker_check
  ignore_errors: yes

- name: Install Docker if missing
  yum:
    name: docker
    state: present
  when: docker_check.failed

- name: Start Docker
  service:
    name: docker
    state: started
    enabled: yes

# ---------------------------------------------------------
# 3. Build Docker image only when code changed
# ---------------------------------------------------------

- name: Build Docker image only when code changed
  community.docker.docker_image:
    name: mywebapp
    build:
      path: /home/ec2-user/webapp
  when: code_changed

# ---------------------------------------------------------
# 4. Deploy container only when image changed
# ---------------------------------------------------------

- name: Deploy new container only when code changed
  community.docker.docker_container:
    name: webapp
    image: mywebapp:latest
    state: started
    recreate: true
    restart_policy: always
    published_ports:
      - "80:80"
  when: code_changed
