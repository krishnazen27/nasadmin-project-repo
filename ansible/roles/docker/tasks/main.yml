- name: Install dependencies
  apt:
    name: ["apt-transport-https", "ca-certificates", "curl", "software-properties-common"]
    state: present
    update_cache: yes

- name: Install Docker
  apt:
    name: docker.io
    state: present

- name: Start Docker
  service:
    name: docker
    state: started
    enabled: yes

- name: Copy web application files
  copy:
    src: webapp/
    dest: /home/ubuntu/webapp/
    owner: ubuntu
    group: ubuntu
    mode: 0755

- name: Build Docker image
  command: docker build -t webapp /home/ubuntu/webapp

- name: Run container
  command: docker run -d -p 80:80 webapp
