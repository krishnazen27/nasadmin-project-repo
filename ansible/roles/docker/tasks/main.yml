---
- name: Check if Docker is installed
  command: docker --version
  register: docker_check
  ignore_errors: yes

- name: Install dependencies (only if Docker is missing)
  yum:
    name: yum-utils
    state: present
  when: docker_check.failed

- name: Install Docker (only if missing)
  yum:
    name: docker
    state: present
  when: docker_check.failed

- name: Start & enable Docker service
  service:
    name: docker
    state: started
    enabled: yes

- name: Copy webapp folder (Dockerfile + app.py) to EC2
  copy:
    src: webapp/
    dest: /home/ec2-user/webapp/
    mode: '0755'

- name: Build Docker image from Dockerfile
  command: docker build -t mywebapp:latest /home/ec2-user/webapp/

- name: Stop old container if running
  docker_container:
    name: webapp
    state: absent
  ignore_errors: yes

- name: Run web application container
  docker_container:
    name: webapp
    image: mywebapp:latest
    state: started
    restart_policy: always
    published_ports:
      - "80:80"