---
# ---------------------------------------------------------
# 1. Copy webapp folder FIRST (Dockerfile + app.py)
# ---------------------------------------------------------

- name: Copy webapp folder to EC2
  copy:
    src: webapp/
    dest: /home/ec2-user/webapp/
    mode: '0755'

# ---------------------------------------------------------
# 2. Calculate combined checksum of Dockerfile + app.py
# ---------------------------------------------------------

- name: Calculate combined checksum of Dockerfile + app.py
  command: bash -c "cat /home/ec2-user/webapp/Dockerfile /home/ec2-user/webapp/app.py | sha256sum"
  register: new_checksum

# ---------------------------------------------------------
# 3. Check if previous checksum exists
# ---------------------------------------------------------

- name: Check if previous checksum exists
  stat:
    path: /home/ec2-user/webapp.checksum
  register: checksum_file

- name: Load previous checksum
  command: cat /home/ec2-user/webapp.checksum
  register: old_checksum
  when: checksum_file.stat.exists

# ---------------------------------------------------------
# 4. Compare checksums
# ---------------------------------------------------------

- name: Determine if code changed
  set_fact:
    code_changed: "{{ (not checksum_file.stat.exists) or (new_checksum.stdout.split()[0] != old_checksum.stdout.split()[0]) }}"

# ---------------------------------------------------------
# 5. Print no-change message
# ---------------------------------------------------------

- name: Print no-change message
  debug:
    msg: "No change in application code. Deployment skipped."
  when: not code_changed

# ---------------------------------------------------------
# 6. Save new checksum
# ---------------------------------------------------------

- name: Save new checksum
  copy:
    content: "{{ new_checksum.stdout.split()[0] }}"
    dest: /home/ec2-user/webapp.checksum
  when: code_changed

# ---------------------------------------------------------
# 7. Install Docker (idempotent)
# ---------------------------------------------------------

- name: Check if Docker is installed
  command: docker --version
  register: docker_check
  ignore_errors: yes

- name: Install Docker if missing
  yum:
    name: docker
    state: present
  when: docker_check.failed

- name: Start Docker
  service:
    name: docker
    state: started
    enabled: yes

# ---------------------------------------------------------
# 8. Build Docker image only when code changed
# ---------------------------------------------------------

- name: Build Docker image only when code changed
  docker_image:
    name: mywebapp
    build:
      path: /home/ec2-user/webapp
  when: code_changed

# ---------------------------------------------------------
# 9. Deploy container only when image changed
# ---------------------------------------------------------

- name: Deploy new container only when code changed
  docker_container:
    name: webapp
    image: mywebapp:latest
    state: started
    recreate: true
    restart_policy: always
    published_ports:
      - "80:80"
  when: code_changed
