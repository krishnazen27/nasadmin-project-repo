- name: Install dependencies
  apt:
    name: ["apt-transport-https", "ca-certificates", "curl", "software-properties-common"]
    state: present
    update_cache: yes

- name: Install Docker
  apt:
    name: docker.io
    state: present

- name: Start Docker
  service:
    name: docker
    state: started
    enabled: yes

- name: Build Docker image
  command: docker build -t webapp /home/ubuntu/app

- name: Run container
  command: docker run -d -p 80:80 webapp
